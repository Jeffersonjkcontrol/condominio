<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Figueira Garden</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7f9;
        color: #111827;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #2563eb;
        color: #fff;
        font-size: 34px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #6b7280; font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 16px;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">F</div>
      <h1>Você está sem conexão</h1>
      <p>Reconecte à internet para continuar usando o app de gestão do condomínio.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
